<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Loja O Boticário - Os melhores produtos de beleza e perfumaria" />
    <title>oBoticário</title>
    
    <!-- Script Utmify - Rastreamento UTM -->
    <script>
      (function(){
        const captureParams = () => {
          const params = new URLSearchParams(window.location.search);
          const utmParams = {};
          params.forEach((value, key) => {
            if (key.startsWith('utm_') || key === 'src' || key === 'sck' || key === 'utm_source' || key === 'utm_medium' || key === 'utm_campaign' || key === 'utm_content' || key === 'utm_term') {
              utmParams[key] = value;
            }
          });
          if (Object.keys(utmParams).length > 0) {
            try {
              localStorage.setItem('utmParams', JSON.stringify(utmParams));
              console.log('[UTMIFY DEBUG] UTM params salvos:', utmParams);
            } catch(e) {
              console.log('[UTMIFY DEBUG] Erro ao salvar params:', e);
            }
          }
        };
        
        // Captura imediatamente
        captureParams();
        
        // Verifica se tem salvo e adiciona nos links
        try {
          const saved = localStorage.getItem('utmParams');
          if (saved) {
            const params = JSON.parse(saved);
            console.log('[UTMIFY DEBUG] Verificando UTMs salvos...', params);
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Script oficial Utmify -->
    <script src="https://cdn.utmify.com.br/scripts/utms/latest.js" async defer></script>
    
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
